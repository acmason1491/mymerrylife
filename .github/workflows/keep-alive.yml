name: supabase-keep-alive

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://qhlyayhszkpotwjijvrm.supabase.co
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1")
          echo "Supabase REST ping returned HTTP ${code}"
          [ "${code}" = "200" ] || { echo "::error::Ping failed (HTTP ${code})"; exit 1; }